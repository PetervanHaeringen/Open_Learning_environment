questions:
  - id: q1
    type: mcq
    text: "Hoeveel plaatsen verschuift de komma bij km³ → mm³?"
    options:
      - id: a
        text: "9 plaatsen"
      - id: b
        text: "12 plaatsen"
      - id: c
        text: "18 plaatsen"
      - id: d
        text: "6 plaatsen"
    answer: "c"

  - id: q2
    type: mcq
    text: "Wat is de beste strategie voor km³ → mm³?"
    options:
      - id: a
        text: "In één keer rekenen"
      - id: b
        text: "Eerst omrekenen naar m³"
      - id: c
        text: "Gokken"
      - id: d
        text: "Rekenmachine gebruiken"
    answer: "b"

  - id: q3
    type: truefalse
    text: "1 km³ = 10⁹ m³ en 1 m³ = 10⁹ mm³, dus 1 km³ = 10¹⁸ mm³."
    answer: true

  - id: q4
    type: mcq
    text: "Hoe schrijf je 1.000.000.000.000.000.000 in wetenschappelijke notatie?"
    options:
      - id: a
        text: "1 × 10¹⁵"
      - id: b
        text: "1 × 10¹⁸"
      - id: c
        text: "1 × 10²¹"
      - id: d
        text: "1 × 10¹²"
    answer: "b"

  - id: q5
    type: open
    text: "Leg uit waarom je bij grote omrekeningen beter in stappen kunt werken via m³."
    keywords: ["overzicht", "stap", "m³", "tussentijd", "fout"]
    min_keywords: 2