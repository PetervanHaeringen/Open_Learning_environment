questions:
  - id: q1
    type: mcq
    text: "Hoeveel cm² is 1 dm²?"
    options:
      - id: a
        text: "10 cm²"
      - id: b
        text: "100 cm²"
      - id: c
        text: "1000 cm²"
      - id: d
        text: "1 cm²"
    answer: "b"

  - id: q2
    type: mcq
    text: "Hoeveel m² is 2 km²?"
    options:
      - id: a
        text: "2000 m²"
      - id: b
        text: "20.000 m²"
      - id: c
        text: "2.000.000 m²"
      - id: d
        text: "200 m²"
    answer: "c"

  - id: q3
    type: truefalse
    text: "Bij oppervlakte verschuift de komma 2 plaatsen per trede op de ladder."
    answer: true

  - id: q4
    type: mcq
    text: "Waarom verschuift de komma bij oppervlakte 2 plaatsen per trede?"
    options:
      - id: a
        text: "Omdat het anders te moeilijk is"
      - id: b
        text: "Omdat oppervlakte = lengte × lengte = 10 × 10 = 100"
      - id: c
        text: "Omdat de eenheden anders zijn"
      - id: d
        text: "Dat weet niemand"
    answer: "b"

  - id: q5
    type: open
    text: "Leg uit waarom 1 m² = 10.000 cm²."
