questions:
  - id: q1
    type: mcq
    text: "Hoeveel cm³ is 1 dm³?"
    options:
      - id: a
        text: "10 cm³"
      - id: b
        text: "100 cm³"
      - id: c
        text: "1000 cm³"
      - id: d
        text: "1 cm³"
    answer: "c"

  - id: q2
    type: mcq
    text: "Hoeveel m³ is 2 km³?"
    options:
      - id: a
        text: "2.000.000 m³"
      - id: b
        text: "2.000.000.000 m³"
      - id: c
        text: "20.000 m³"
      - id: d
        text: "200 m³"
    answer: "b"

  - id: q3
    type: truefalse
    text: "Bij inhoud verschuift de komma 3 plaatsen per trede op de ladder."
    answer: true

  - id: q4
    type: mcq
    text: "Waarom is 1 m³ = 1.000.000 cm³?"
    options:
      - id: a
        text: "Omdat 1 m = 100 cm en 100 × 100 × 100 = 1.000.000"
      - id: b
        text: "Omdat het zo is afgesproken"
      - id: c
        text: "Omdat 1 m = 10 cm"
      - id: d
        text: "Dat is niet waar"
    answer: "a"

  - id: q5
    type: open
    text: "Leg uit waarom de komma bij inhoud 3 keer zoveel plaatsen verschuift als bij lengte."
    keywords: ["drie", "3", "dimensie", "lengte", "kubus", "keer"]
    min_keywords: 2