questions:
  - id: q1
    type: mcq
    text: "Waarom gebruiken mensen waarschijnlijk een tientallig stelsel?"
    options:
      - id: a
        text: "Omdat 10 wiskundig het beste getal is"
      - id: b
        text: "Omdat we 10 vingers hebben"
      - id: c
        text: "Omdat de natuur 10 als basis gebruikt"
      - id: d
        text: "Omdat het zo is afgesproken"
    answer: "b"

  - id: q2
    type: mcq
    text: "Een spin heeft 8 poten. Als een spin kon tellen, welk stelsel zou dan het meest voor de hand liggen?"
    options:
      - id: a
        text: "Basis 10"
      - id: b
        text: "Basis 8"
      - id: c
        text: "Basis 6"
      - id: d
        text: "Basis 2"
    answer: "b"

  - id: q3
    type: truefalse
    text: "Een bij bouwt zeshoekige raten. Dit betekent dat bijen in basis 6 denken."
    answer: false

  - id: q4
    type: mcq
    text: "Wat is een 'mixed-radix' stelsel?"
    options:
      - id: a
        text: "Een stelsel dat alleen uit breuken bestaat"
      - id: b
        text: "Een stelsel waarbij elke positie een andere basis heeft"
      - id: c
        text: "Een stelsel dat alleen door computers wordt gebruikt"
      - id: d
        text: "Een stelsel zonder nul"
    answer: "b"

  - id: q5
    type: open
    text: "Denk je dat je bewustzijn nodig hebt om te kunnen tellen? Leg je antwoord uit."
    keywords: ["bewustzijn", "tellen", "natuur", "instinct", "wiskunde", "denken"]
    min_keywords: 2
