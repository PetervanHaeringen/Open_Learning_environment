questions:
  - id: local.welkom.intro.q01
    type: mcq
    prompt: Waar worden de lessen in OpenGarden opgeslagen?
    options:
      - id: a
        text: In een MySQL-database
      - id: b
        text: In YAML- en Markdown-bestanden
      - id: c
        text: In een cloud-API
      - id: d
        text: In Word-documenten
    answer: b
    hint: Denk aan de bestanden die je net hebt gezien.
    explanation: OpenGarden leest lesinhoud rechtstreeks uit YAML (meta + vragen) en Markdown (tekst). Zo blijft alles leesbaar en versieerbaar.

  - id: local.welkom.intro.q02
    type: truefalse
    prompt: Je hebt een database-migratie nodig om een nieuwe les toe te voegen.
    answer: false
    explanation: Niet nodig! Je maakt simpelweg een nieuwe map met meta.yaml, lesson.md en questions.yaml. De app leest het automatisch.

  - id: local.welkom.intro.q03
    type: open
    prompt: Wat zou jij als eerste onderwerp willen aanbieden in jouw OpenGarden?
    sample_answer: Bijvoorbeeld "biologie — celstructuur" of "geschiedenis — de Tweede Wereldoorlog"
    keywords:
      - onderwerp
      - vak
      - les
    explanation: Er is geen fout antwoord. Dit is jouw tuin — jij bepaalt wat er groeit.
