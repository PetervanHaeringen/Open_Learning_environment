{% extends "base.html" %}
{% block title %}Inloggen{% endblock %}

{% block content %}
<h1>Inloggen</h1>

<form method="POST">
    <label>
        Gebruikersnaam:
        <input type="text" name="username" required autofocus>
    </label>
    <label>
        Wachtwoord:
        <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn">Inloggen</button>
</form>

<p style="margin-top: 1rem;">Nog geen account? <a href="{{ url_for('auth.register') }}">Registreer hier</a></p>
{% endblock %}
