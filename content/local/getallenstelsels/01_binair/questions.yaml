questions:
  - id: q1
    type: mcq
    text: "Hoeveel verschillende cijfers heeft het binaire stelsel?"
    options:
      - id: a
        text: "10"
      - id: b
        text: "2"
      - id: c
        text: "16"
      - id: d
        text: "8"
    answer: "b"

  - id: q2
    type: mcq
    text: "Wat is de decimale waarde van het binaire getal 1010?"
    options:
      - id: a
        text: "5"
      - id: b
        text: "8"
      - id: c
        text: "10"
      - id: d
        text: "12"
    answer: "c"

  - id: q3
    type: truefalse
    text: "Een byte bestaat uit 8 bits."
    answer: true

  - id: q4
    type: mcq
    text: "Welk binair getal staat gelijk aan 13 in decimaal?"
    options:
      - id: a
        text: "1101"
      - id: b
        text: "1011"
      - id: c
        text: "1110"
      - id: d
        text: "1001"
    answer: "a"

  - id: q5
    type: open
    text: "Leg in eigen woorden uit waarom computers het binaire stelsel gebruiken."
    keywords: ["aan", "uit", "stroom", "elektrisch", "twee", "toestanden"]
    min_keywords: 2
